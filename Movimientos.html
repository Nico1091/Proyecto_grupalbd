<!-- index.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSocialPro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1><span style="font-size:24px;">Ⓡ</span> RedSocialPro</h1>
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Icono de usuario" class="logo" />

        <!-- LOGIN -->
        <div class="form-section" id="loginSection">
            <h2>Iniciar Sesión</h2>
            <div class="login-box">
                <select id="tipoUsuario">
                    <option value="1">Usuario normal</option>
                    <option value="2">Administrador</option>
                </select>
                <input type="text" id="usuario" placeholder="Nombre de usuario o correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <div id="loginError" class="error-message"></div>
                <button id="loginButton">Iniciar Sesión</button>
                <div class="toggle-form">
                    ¿No tienes una cuenta? <a href="#" id="toRegister">Regístrate aquí</a>
                </div>
            </div>
        </div>

        <!-- REGISTRO -->
        <div class="form-section" id="registerSection" style="display: none;">
            <h2>Registro de nuevo usuario</h2>
            <div class="login-box">
                <input type="text" id="nombreRegistro" placeholder="Nombre completo" required>
                <input type="email" id="emailRegistro" placeholder="Correo electrónico" required>
                <input type="password" id="passRegistro" placeholder="Contraseña (mínimo 6 caracteres)" required>
                <select id="perfilRegistro">
                    <option value="1">Usuario normal</option>
                    <option value="2">Administrador</option>
                </select>
                <div id="adminCodeContainer" style="display: none; margin-top: 10px;">
                    <input type="password" id="adminCode" placeholder="Código secreto para administrador">
                </div>
                <div id="registerError" class="error-message"></div>
                <div id="registerSuccess" class="success-message"></div>
                <button id="registerButton">Registrarse</button>
                <div class="toggle-form">
                    ¿Ya tienes una cuenta? <a href="#" id="toLogin">Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar y ocultar formularios
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            document.getElementById('toRegister').onclick = () => {
                loginSection.style.display = 'none';
                registerSection.style.display = 'block';
                resetMessages();
            };
            document.getElementById('toLogin').onclick = () => {
                registerSection.style.display = 'none';
                loginSection.style.display = 'block';
                resetMessages();
            };

            // Mostrar campo admin
            document.getElementById('perfilRegistro').addEventListener('change', e => {
                document.getElementById('adminCodeContainer').style.display = e.target.value === '2' ? 'block' : 'none';
            });

            // Botones
            document.getElementById('loginButton').addEventListener('click', iniciarSesion);
            document.getElementById('registerButton').addEventListener('click', registrarUsuario);

            // Enter key
            ['password', 'passRegistro'].forEach(id =>
                document.getElementById(id).addEventListener('keypress', e => {
                    if (e.key === 'Enter') {
                        e.target.id === 'password' ? iniciarSesion() : registrarUsuario();
                    }
                })
            );
        });

        function resetMessages() {
            ['loginError', 'registerError', 'registerSuccess'].forEach(id => document.getElementById(id).textContent = '');
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(pw) {
            return pw.length >= 6;
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            setTimeout(() => el.textContent = '', 5000);
        }

        async function iniciarSesion() {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const id_perfil = +document.getElementById('tipoUsuario').value;
            const btn = document.getElementById('loginButton');

            if (!usuario || !password) { showError('loginError', 'Complete todos los campos.'); return; }
            btn.disabled = true; btn.textContent = 'Iniciando sesión...';

            try {
                const res = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password, id_perfil })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = data.usuario.id_perfil === 2 ? 'Movimiento.html' : 'bienvenida.html';
                } else {
                    showError('loginError', data.message || 'Error al iniciar sesión');
                }
            } catch {
                showError('loginError', 'No se pudo conectar al servidor');
            } finally {
                btn.disabled = false; btn.textContent = 'Iniciar Sesión';
            }
        }

        async function registrarUsuario() {
            const nombre = document.getElementById('nombreRegistro').value.trim();
            const email = document.getElementById('emailRegistro').value.trim();
            const contrasena = document.getElementById('passRegistro').value.trim();
            const id_perfil = +document.getElementById('perfilRegistro').value;
            const adminCode = document.getElementById('adminCode')?.value;
            const btn = document.getElementById('registerButton');

            if (!nombre || !email || !contrasena) { showError('registerError', 'Complete todos los campos.'); return; }
            if (!validateEmail(email)) { showError('registerError', 'Email no válido.'); return; }
            if (!validatePassword(contrasena)) { showError('registerError', 'Contraseña muy corta.'); return; }
            if (id_perfil === 2 && adminCode !== 'ADMON123') {
                showError('registerError', 'Código de admin incorrecto'); return;
            }

            btn.disabled = true; btn.textContent = 'Registrando...';

            try {
                const res = await fetch('http://localhost:3000/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, contrasena, id_perfil, adminCode: id_perfil === 2 ? adminCode : null })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('registerSuccess').textContent = 'Registro exitoso.';
                } else {
                    showError('registerError', data.message || 'Error al registrar');
                }
            } catch {
                showError('registerError', 'No se pudo conectar al servidor');
            } finally {
                btn.disabled = false; btn.textContent = 'Registrarse';
            }
        }
    </script>
</body>

</html>
